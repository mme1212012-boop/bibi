name: Build Windows executables

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH."
          }
          $sourceVersion = python -c "from version import APP_VERSION; print(APP_VERSION)"
          if ($sourceVersion.Trim() -ne $version) {
            throw "Tag version $version does not match version.py ($sourceVersion)."
          }
          $installerScript = Get-Content installer.iss -Raw
          if ($installerScript -notmatch ('#define AppVersion "' + [regex]::Escape($version) + '"')) {
            throw "Tag version $version does not match installer.iss."
          }

      - name: Package Bibi
        run: pyinstaller --noconfirm --clean --windowed --onedir --name Bibi bibi.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "$env:GITHUB_REF_NAME" dist/Bibi-Setup.exe --title "Bibi $env:GITHUB_REF_NAME" --generate-notes

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: Bibi-Windows
          path: |
            dist/Bibi-Setup.exe
            dist/Bibi/Bibi.exe
          if-no-files-found: error
